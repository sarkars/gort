[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gortguard"
version = "0.0.0"
description = "GORT (Guard, Observe, Repair, Test): best-practice packs and checks for AI agents. In design; not released."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
gort = "gortguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
